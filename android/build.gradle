// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ── توافقٌ مع JDK 17 المتوفّرِ على هذا الجهاز ──
// كاباسيتور 8 يستهدفُ Java 21، لكنّ الـJDK المتاحَ هنا هو 17؛
// نخفضُ توافقَ الوحداتِ إلى 17 (شيفرةُ الإضافاتِ متوافقةٌ ولا تستعملُ صياغةَ 21).
subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        p.tasks.configureEach { t ->
            if (t.class.name.contains('KotlinCompile') && t.hasProperty('kotlinOptions')) {
                t.kotlinOptions.jvmTarget = '17'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
